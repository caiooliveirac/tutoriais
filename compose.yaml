# LIVE no magalu. nginx do host: location /tutoriais/ -> 127.0.0.1:3099.
# Segredos só no .env do servidor (fora do git).
name: tutoriais

services:
    app:
        build: .
        restart: unless-stopped
        env_file: .env
        ports:
            - '127.0.0.1:3099:80'
        volumes:
            - storage:/app/storage
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mariadb:11.8
        restart: unless-stopped
        environment:
            MARIADB_DATABASE: ${DB_DATABASE}
            MARIADB_USER: ${DB_USERNAME}
            MARIADB_PASSWORD: ${DB_PASSWORD}
            MARIADB_RANDOM_ROOT_PASSWORD: '1'
        volumes:
            - db:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            retries: 20

volumes:
    storage:
    db:
